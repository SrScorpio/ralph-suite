name: Build & Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run compile
      - run: npm test
      - name: Fail if gitignored files are tracked
        run: |
          leaked="$(git ls-files -c -i --exclude-standard)"
          if [ -n "$leaked" ]; then
            echo "Tracked files match .gitignore:"
            echo "$leaked"
            exit 1
          fi
      - run: npx vsce package --no-dependencies --allow-missing-repository
      - uses: actions/upload-artifact@v4
        with:
          name: ralph-suite-vsix
          path: '*.vsix'
