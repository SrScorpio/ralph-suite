name: Build & Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run compile
      - run: npx vsce package --no-dependencies --allow-missing-repository
      - uses: actions/upload-artifact@v4
        with:
          name: ralph-suite-vsix
          path: '*.vsix'
